name: Build image (reusable)

# Reusable workflow: build (and optionally publish) one image target of the calling repository
# for a single ROS distro: dev, runtime (with a version, what reusable_release_image.yml
# uses), dev,runtime (both sharing one compile, what reusable_nightly_image.yml uses), or ci
# (the repository's workspace without the repository, which ci-workflows builds and tests on).
# See README.md for the architecture (stage graph, strict-vs-lenient dependency gate, dev's
# lean fallback).
#
# Each architecture builds natively on its own runner and pushes its images by digest; the
# merge job then tags the digests of every architecture as multi-arch images.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "ROS distro (humble|jazzy|kilted|lyrical|rolling)"
        required: true
        type: string
      target:
        description: "Image target(s) to build: dev, runtime, dev,runtime (one shared compile) or ci"
        required: false
        default: "runtime"
        type: string
      image_date:
        description: "Shared date tag (YYYY-MM-DD) for this run; blank = today"
        required: false
        default: ""
        type: string
      publish:
        description: "Push the built image to ghcr.io (otherwise build/load only)"
        required: false
        default: false
        type: boolean
      version:
        description: "Release version (target runtime or dev,runtime): tags each image :<distro>-<version> instead of the nightly tags, refuses an existing one, and with publish moves :<distro> to it"
        required: false
        default: ""
        type: string
      architectures:
        description: 'JSON list of the architectures to build, of amd64 and arm64 (target ci: exactly one)'
        required: false
        default: '["amd64","arm64"]'
        type: string
      runner:
        description: "Runner label(s) for the amd64 build and the lock and merge jobs"
        required: false
        default: "ubuntu-latest"
        type: string
      runner_arm64:
        description: "Runner label(s) for the arm64 build"
        required: false
        default: "ubuntu-24.04-arm"
        type: string
    secrets:
      CI_PAT:
        description: "GitHub token used by vcs import to clone private repositories; the caller's own token when unset"
        required: false
      DOCKERHUB_USERNAME:
        description: "Docker Hub user for authenticated (per-account rate-limited) pulls; anonymous when unset"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub access token (Public Repo Read-only scope)"
        required: false
    outputs:
      image:
        description: "Reference of the ci image (target ci) or the release image (target runtime with version)"
        value: ${{ jobs.merge.outputs.image || jobs.build.outputs.image }}
      dev_image:
        description: "Reference of the release dev image (target dev,runtime with version)"
        value: ${{ jobs.merge.outputs.dev_image }}

jobs:
  # Resolves the repository set once, so every architecture builds the same commits.
  lock:
    if: ${{ inputs.target != 'ci' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          path: caller
          persist-credentials: false

      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "FACTORY_REF=${WORKFLOW_REF#*@}" >> "$GITHUB_ENV"

      - name: Checkout the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ env.FACTORY_REF }}
          path: factory

      - name: Log in to GHCR
        if: ${{ inputs.publish }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the repository set
        env:
          GIT_AUTH_TOKEN: ${{ secrets.CI_PAT || github.token }}
          IMAGE_DATE: ${{ inputs.image_date }}
          VERSION: ${{ inputs.version }}
        run: |
          ARGS=(--source caller --ros-distro "${{ inputs.ros_distro }}" --target "${{ inputs.target }}" --resolve-to lock)
          [ -z "$VERSION" ] || ARGS+=(--version "$VERSION")
          ./factory/scripts/build_workspace.sh "${ARGS[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: lock-${{ inputs.ros_distro }}
          path: lock/
          retention-days: 1
          overwrite: true

  # One build leg per architecture, on that architecture's runner.
  build:
    needs: lock
    if: ${{ !cancelled() && needs.lock.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && inputs.runner_arm64 || inputs.runner }}
    timeout-minutes: 90
    outputs:
      image: ${{ steps.build.outputs.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the architectures
        if: ${{ inputs.target == 'ci' && strategy.job-total != 1 }}
        run: |
          echo "::error::a ci image is per architecture: build target ci for one at a time"; exit 1

      # Not persisted: the checkout's .git goes into the image's build stages. build_workspace.sh
      # names the repository after the checkout's origin remote, not after this path.
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          path: caller
          persist-credentials: false

      # The checkout above takes the calling repository. job.workflow_ref names this file's
      # own repository and revision, so a caller pinning this workflow pins the factory and,
      # through FACTORY_REF, the base images it builds on.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          # Also read by scripts/image_env.sh: picks the ros2-base / ros2-dev release to build on.
          echo "FACTORY_REF=${WORKFLOW_REF#*@}" >> "$GITHUB_ENV"

      - name: Checkout the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ env.FACTORY_REF }}
          path: factory

      - name: Download the repository set
        if: ${{ inputs.target != 'ci' }}
        uses: actions/download-artifact@v8
        with:
          name: lock-${{ inputs.ros_distro }}
          path: lock

      - name: Build ${{ inputs.target }}
        id: build
        uses: ./factory/actions/build-image
        with:
          source: caller
          ros_distro: ${{ inputs.ros_distro }}
          target: ${{ inputs.target }}
          image_date: ${{ inputs.image_date }}
          publish: ${{ inputs.publish }}
          version: ${{ inputs.version }}
          lock: ${{ inputs.target != 'ci' && 'lock' || '' }}
          # Tagged together with the other architectures' by the merge job.
          digests: ${{ inputs.target != 'ci' && 'digests' || '' }}
          arch: ${{ matrix.arch }}
          git_auth_token: ${{ secrets.CI_PAT || github.token }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Upload the digests
        if: ${{ always() && inputs.publish && inputs.target != 'ci' }}
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.ros_distro }}-${{ matrix.arch }}
          path: digests/*.env
          if-no-files-found: ignore
          retention-days: 1
          # A re-run of a failed leg replaces its record.
          overwrite: true

  # Tags every architecture's digests as multi-arch images (scripts/merge_images.sh).
  merge:
    needs: [lock, build]
    if: ${{ !cancelled() && inputs.publish && inputs.target != 'ci' && needs.lock.result == 'success' }}
    runs-on: ${{ inputs.runner }}
    outputs:
      image: ${{ steps.merge.outputs.image }}
      dev_image: ${{ steps.merge.outputs.dev_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout the factory
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: factory

      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ inputs.ros_distro }}-*
          path: digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch images
        id: merge
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          mkdir -p digests
          ./factory/scripts/merge_images.sh --architectures "$(jq -r 'join(",")' <<<"$ARCHITECTURES")" digests

      - name: Write dev/runtime badge artifact
        if: ${{ always() && !inputs.version && contains(inputs.target, 'dev') && contains(inputs.target, 'runtime') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p badge
          render() {
            local kind="$1" result="$2"
            local message="failed" color="red"
            if [ "$result" = "success" ]; then
              message="${{ inputs.image_date }}"
              color="brightgreen"
            fi
            cat > "badge/${{ inputs.ros_distro }}-${kind}.json" <<EOF
          {"schemaVersion":1,"label":"","message":"${message}","color":"${color}"}
          EOF
          }
          render dev "${{ steps.merge.outputs.dev_result }}"
          render runtime "${{ steps.merge.outputs.runtime_result }}"

      - name: Upload dev/runtime badge artifact
        if: ${{ always() && !inputs.version && contains(inputs.target, 'dev') && contains(inputs.target, 'runtime') }}
        uses: actions/upload-artifact@v7
        with:
          name: badge-${{ inputs.ros_distro }}
          path: badge/*.json
          retention-days: 1
          overwrite: true
