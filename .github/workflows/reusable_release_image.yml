name: Release images

# Reusable workflow: cuts a versioned runtime and dev image of the calling repository.
#
# What this produces, given e.g. a call from duatic_dynaarm with ros_distro=jazzy, version=1.0.0:
#   - ghcr.io/duatic/dynaarm:jazzy-1.0.0       (immutable, refuses to overwrite)
#   - ghcr.io/duatic/dynaarm:jazzy             (moved to point at jazzy-1.0.0)
#   - ghcr.io/duatic/dynaarm-dev:jazzy-1.0.0   (immutable, the matching development image)
#   - ghcr.io/duatic/dynaarm-dev:jazzy         (moved to it, until the next nightly moves it on)
#   - git tag release/jazzy/1.0.0 on the calling repository
#   - a GitHub Release on that tag carrying the exact source pin (sources.lock.repos) and a
#     snapshot of what's actually installed (packages.txt, pip-freeze.txt, ros2-pkg-list.txt)
#
# Each image is a multi-arch index over `architectures`. The images are built by
# reusable_build_image.yml, like every other image, from one compile of the workspace per
# architecture, and tagged only when every architecture built both: a failed leg leaves the
# version unused.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: "ROS distro to release"
        required: true
        type: string
      version:
        description: "Version to tag (e.g. 1.0.0); must not already exist"
        required: true
        type: string
      architectures:
        description: 'JSON list of the architectures to build, of amd64 and arm64'
        required: false
        default: '["amd64","arm64"]'
        type: string
      runner:
        description: "Runner label(s) for the amd64 build and every other job"
        required: false
        default: "ubuntu-latest"
        type: string
      runner_arm64:
        description: "Runner label(s) for the arm64 builds"
        required: false
        default: "ubuntu-24.04-arm"
        type: string
    secrets:
      CI_PAT:
        description: "GitHub token used by vcs import to clone private repositories"
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

# Shares reusable_nightly_image.yml's group so the two never race. Never cancelled: it pushes
# immutable :<distro>-<version> tags and moves :<distro>.
concurrency:
  group: duatic-image-publish
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_build_image.yml
    with:
      ros_distro: ${{ inputs.ros_distro }}
      target: dev,runtime
      version: ${{ inputs.version }}
      publish: true
      architectures: ${{ inputs.architectures }}
      runner: ${{ inputs.runner }}
      runner_arm64: ${{ inputs.runner_arm64 }}
    secrets:
      CI_PAT: ${{ secrets.CI_PAT }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: build
    runs-on: ${{ inputs.runner }}
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      DEV_IMAGE: ${{ needs.build.outputs.dev_image }}
      DISTRO: ${{ inputs.ros_distro }}
      TAG: release/${{ inputs.ros_distro }}/${{ inputs.version }}
    permissions:
      contents: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect release artifacts
        id: collect
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" cat /etc/duatic/sources.lock.repos > sources.lock.repos
          docker run --rm "$IMAGE" dpkg -l > packages.txt
          docker run --rm "$IMAGE" pip3 freeze > pip-freeze.txt
          docker run --rm "$IMAGE" bash -c \
            'source /opt/ros/$ROS_DISTRO/setup.bash && source /opt/duatic/ws/install/setup.bash && ros2 pkg list' \
            > ros2-pkg-list.txt
          docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' > digest.txt
          echo "Digest: $(cat digest.txt)"
          echo "title=${IMAGE#ghcr.io/duatic/}" >> "$GITHUB_OUTPUT"
          cat > notes.md <<EOF
          Runtime image: \`${IMAGE}\` (also tagged \`:${DISTRO}\`)
          Digest: $(cat digest.txt)
          Development image: \`${DEV_IMAGE}\`, the same workspace with the developer tooling
          Built from \`${GITHUB_REPOSITORY}\`@\`${GITHUB_SHA}\`

          Robots pin to \`${IMAGE}\` directly, or track the latest release, \`${IMAGE%:*}:${DISTRO}\`.
          packages.txt, pip-freeze.txt and ros2-pkg-list.txt below describe the $(uname -m) image.
          Reproduce this exact build from a checkout of \`${TAG}\` with
          \`build_workspace.sh --source <checkout> --sources-lock sources.lock.repos\`
          (see https://github.com/Duatic/duatic_ros2_docker_images#every-image-knows-what-it-is-made-of).
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.collect.outputs.title }}
          body_path: notes.md
          fail_on_unmatched_files: true
          files: |
            sources.lock.repos
            packages.txt
            pip-freeze.txt
            ros2-pkg-list.txt
            digest.txt
