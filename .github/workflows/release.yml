name: Release

# Dispatch opens the `release: X.Y.Z` pull request with the next CHANGELOG.rst section, the bump
# derived from the commits unless overridden. Merging it pushes the versioned images for every
# distro, then tags vX.Y.Z, moves vX and publishes the GitHub Release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the bump derived from the commits'
        type: choice
        options: [derived, major, minor, patch]
        default: derived
      runner:
        description: 'Runner label(s) for the prepare job'
        type: string
        default: 'ubuntu-latest'
  pull_request:
    types: [closed]

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    uses: Duatic/ci-workflows/.github/workflows/reusable_prepare_changelog_release.yml@v2
    with:
      bump: ${{ inputs.bump }}
      runner: ${{ inputs.runner }}
    secrets: inherit

  # The version comes from the merged pull request's title: the tag job runs last.
  version:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - id: parse
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::cannot read a version from the title: $TITLE"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy, kilted, lyrical, rolling]
    uses: ./.github/workflows/build_base_images.yml
    permissions:
      contents: read
      packages: write
    with:
      ros_distro: ${{ matrix.ros_distro }}
      push: true
      version: ${{ needs.version.outputs.version }}

  # Last: a repository calling the factory at vX or vX.Y.Z builds on the base images of
  # that release (scripts/image_env.sh), so the tags exist only once every distro is pushed. A
  # failed distro leaves the release untagged, and vX on the previous one.
  tag:
    needs: publish
    permissions:
      contents: write
    uses: Duatic/ci-workflows/.github/workflows/reusable_changelog_release_tag.yml@v2
